<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Trunfo - Locke & Key</title>
    <link rel="stylesheet" href="atv.css">
</head>
<body>

    <main class="deck-container">
        
        <article class="card">
            <div class="card-header">
                <span class="card-id">Locke e Key</span>
                <span class="card-category">Guardiões das Chaves</span>
            </div>

            <h2 class="card-title">Kinsey Locke</h2>
            <div class="card-image-container">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhdKjO-JK7uJTmQc_3_vLiKTQcVPdf5mOH1ifGVGpxfw&s=10g" alt="Kinsey Locke" class="card-image">
            </div>

            <div class="card-attributes">
                <div class="attribute-row">
                    <span class="attribute-name">Coragem (Chave da Cabeça)</span>
                    <span class="attribute-value">95</span>
                </div>
                <div class="attribute-row">
                    <span class="attribute-name">Estratégia</span>
                    <span class="attribute-value">80</span>
                </div>
                <div class="attribute-row">
                    <span class="attribute-name">Poder de Ataque (Chave de Fogo)</span>
                    <span class="attribute-value">88</span>
                </div>
                <div class="attribute-row">
                    <span class="attribute-name">Domínio das Chaves</span>
                    <span class="attribute-value">85</span>
                </div>
            </div>
        </article>

    </main>

</body>
</html>
